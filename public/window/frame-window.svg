<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 360" preserveAspectRatio="xMidYMid slice">
  <style>
    .wall{fill:#efe9e1}.low{fill:#e6dfd5}.sky{fill:#e4e9ee}.frame{fill:none;stroke:#f8f5f0;stroke-width:8}.line{fill:none;stroke:rgba(60,46,34,.42);stroke-width:1.2}.bar{stroke:#f8f5f0;stroke-width:3}.sill{fill:#f8f5f0;stroke:rgba(60,46,34,.42);stroke-width:1.2}
    @media (prefers-color-scheme: dark){.wall{fill:#2b2724}.low{fill:#25211e}.sky{fill:#1f2430}.frame{stroke:#3a3531}.line{stroke:rgba(255,240,225,.32)}.bar{stroke:#3a3531}.sill{fill:#3a3531;stroke:rgba(255,240,225,.32)}}
