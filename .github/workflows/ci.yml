name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:mock
  walk:
    # Every room tab as a parent, an adult child and a child, in Chromium,
    # against a mock build (scripts/walk.py). No keys, no network.
    runs-on: ubuntu-latest
    env:
      MOCK: "true"
      NEXT_PUBLIC_MOCK: "true"
      SESSION_SECRET: ci-walk-secret-not-a-real-secret-0000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npx next build
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: Walk every room
        run: |
          npx next start -p 3100 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3100/ && break; sleep 1; done
          python scripts/walk.py --base http://127.0.0.1:3100
          python scripts/a11y.py --base http://127.0.0.1:3100
      - name: UI inventory is current (scripts/ui-inventory.py)
        # Regenerates docs/ui-inventory.csv from a fresh server of the mock build (its own port, so the
        # demo state is the same as on a developer's machine) and fails on any difference.
        run: |
          python scripts/ui-inventory.py --serve 3200 --no-xlsx
          if ! git diff --exit-code --stat -- docs/ui-inventory.csv; then
            echo "::error::UI changed: run npm run ui:inventory and commit docs/ui-inventory.*"
            git --no-pager diff -U0 -- docs/ui-inventory.csv | head -80
            exit 1
          fi
      - name: Upload the regenerated UI inventory (commit this file when the step above fails)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-inventory
          path: docs/ui-inventory.csv
      - name: Bundle budget (shared client JS)
        run: node scripts/perf-budget.mjs
      - name: Vitals (courtyard LCP and CLS, 390px, 4G, 4x CPU)
        run: |
          curl -sf -o /dev/null http://127.0.0.1:3100/ || {
            npx next start -p 3100 > next.log 2>&1 &
            for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3100/ && break; sleep 1; done
          }
          python scripts/perf-vitals.py --base http://127.0.0.1:3100 --max-lcp 2500 --max-cls 0.1
      - if: failure()
        run: tail -100 next.log
